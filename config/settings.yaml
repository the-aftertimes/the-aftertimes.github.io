site:
  name: "The Aftertimes"
  tagline: "Tomorrow's headlines, a little early"
  base_url: "https://the-aftertimes.github.io"
timezone: "Australia/Sydney"
update_hour_utc: 20
output_html: "index.html"
signup_form_url: "https://6de84235.sibforms.com/serve/MUIFAH84x8Y5Zc4rzquN71pwQaj-zgUD8ZHzxwOoChOWvx_0PJrsbbA2YFNI9QVe49LjX6dXBWm96m0PKkJYjZkfi6Kc_nEl1GG6TW8rh_-r021yVFQEwNN70Wxe2U73N9IZ3x3S-o2B02EiXBJ36hNF6fO63Ate8mOAXb3Hhzplkqg-KpyoB_SuguQhpxzQKrJ1x4v49Ys9jTpUmA=="   # Brevo "The Aftertimes signup" form (single opt-in, no confirmation)

newsletter:
  enabled: true
  provider: brevo
  api_base: https://api.brevo.com/v3
  sender_name: "The Aftertimes"
  sender_email: "charlie.rochfordgroup@gmail.com"   # Brevo-verified sender
  list_id: 3                                        # Brevo list "The Aftertimes" (#3)

dates:
  min_years: 8
  band_weights: [0.70, 0.25, 0.05]   # near, mid, deep
  bands:
    near: [8, 300]
    mid: [300, 3000]
    deep: [3000, 40000]
  anti_cluster:
    era_bucket_years: 50    # two dates in the same 50-year bucket count as the same era
    avoid_recent_days: 5    # do not reuse an era used within the last N dispatches
    max_attempts: 12        # resample attempts before giving up

ideate:
  n_premises: 8
  bible_slice_size: 6       # how many bible motifs to offer the model as optional colour
  recent_premise_window: 20 # how many recent headlines/premises to show as "avoid"

novelty:
  match_threshold: 0.45     # cosine >= this vs a recent dispatch = too similar, reject
  recent_window: 30         # compare against the last N dispatches

gemini:
  model: "gemini-3.6-flash"
  endpoint: "https://generativelanguage.googleapis.com/v1beta/models"
  timeout_seconds: 60
  max_retries: 2
  temperature_ideate: 1.1
  temperature_write: 0.9

image:
  enabled: true
  model: "@cf/black-forest-labs/flux-1-schnell"
  steps: 8
  timeout: 120
  crop: [0.03, 0.03, 0.97, 0.86]   # left, top, right, bottom fractions - drops the caption band
  dir: "assets/img"
