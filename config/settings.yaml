site:
  name: "The Aftertimes"
  tagline: "Tomorrow's headlines, a little early"
  base_url: "https://aftertimes.charlietrenorden.com"
timezone: "Australia/Sydney"
update_hour_utc: 20
output_html: "index.html"
# Newsletter RETIRED 13/08/2026 - empty means render.py omits the signup section
# entirely (see _signup: it returns "" on a falsy URL), so the site is web-only.
signup_form_url: ""

newsletter:
  enabled: false   # RETIRED 13/08/2026 - send_email.py dry-runs while this is false
  provider: brevo
  api_base: https://api.brevo.com/v3
  sender_name: "The Aftertimes"
  # MUST be on a Brevo-authenticated domain. A freemail address cannot be
  # authenticated, so Brevo rewrites the From to its own SHARED <id>.brevosend.com
  # and you inherit that domain's cold reputation - which made a new subscriber's
  # FIRST edition land in spam every time. mail.charlietrenorden.com is
  # authenticated in this Brevo account (SPF/DKIM/DMARC), so the From survives.
  # The address must ALSO exist as a Brevo Sender or the campaign API returns
  # 400 "Sender is invalid / inactive" - see brevo_sender.py.
  sender_email: "aftertimes@mail.charlietrenorden.com"
  list_id: 3                                        # Brevo list "The Aftertimes" (#3)

dates:
  # 04/08/2026: pushed further out. The old settings (min 8 years, 70% weight on
  # an 8-300 band, log-uniform favouring the near end) kept landing in the 2030s-
  # 2060s, and a 33-years-hence dispatch does not read as futuristic - Charlie:
  # "this doesn't seem very futuristic at all / or spacey / almost like back in
  # time". Nothing nearer than 60 years now, and the mid band carries equal weight.
  # 04/08/2026: deep band dropped (was [4000, 40000] at 0.15). A 35,000-years-out
  # dispatch is past what the model can furnish plausibly - it kept reaching for
  # present-day props (a Boston fern by candlelight, a coffee press, banners at
  # half-mast), and that produced the weakest writing on the site. Writing quality
  # is the product, so the ceiling is now ~4000 years. The three bands are kept so
  # the sampler and era rules stay unchanged; "deep" is simply the top of the range.
  min_years: 60
  band_weights: [0.45, 0.40, 0.15]   # near, mid, deep
  bands:
    near: [60, 400]
    mid: [400, 1500]
    deep: [1500, 4000]
  anti_cluster:
    era_bucket_years: 50    # two dates in the same 50-year bucket count as the same era
    avoid_recent_days: 5    # do not reuse an era used within the last N dispatches
    max_attempts: 12        # resample attempts before giving up

ideate:
  n_premises: 8
  bible_slice_size: 6       # how many bible motifs to offer the model as optional colour
  recent_premise_window: 20 # how many recent headlines/premises to show as "avoid"

novelty:
  match_threshold: 0.45     # cosine >= this vs a recent dispatch = too similar, reject
  recent_window: 30         # compare against the last N dispatches

gemini:
  model: "gemini-3.6-flash"            # default for ideate + the write-stage fallback
  # write_model: a sharper model for the write stage, falling back to `model` on
  # ANY failure. DISABLED (blank) 31/07/2026: verified that EVERY Pro-tier model
  # (gemini-3.1-pro-preview, gemini-3-pro-preview, gemini-pro-latest,
  # gemini-2.5-pro) returns HTTP 429 quota-exceeded on this free key - the free
  # tier has ZERO Pro quota, exactly like image generation. Leaving it set only
  # burned a wasted call + latency on every run and never once served. The
  # fallback machinery stays in write.py; re-populate this only if the key gets
  # paid/greater quota.
  write_model: ""
  endpoint: "https://generativelanguage.googleapis.com/v1beta/models"
  timeout_seconds: 60
  max_retries: 2
  temperature_ideate: 1.1
  temperature_write: 0.9

image:
  enabled: true
  model: "@cf/black-forest-labs/flux-1-schnell"
  steps: 8
  timeout: 120
  crop: [0.03, 0.03, 0.97, 0.86]   # left, top, right, bottom fractions - drops the caption band
  dir: "assets/img"

# Multi-draft quality pipeline. Every threshold the critic uses lives here so
# tuning never means editing code. `judge` and `revise` are independently
# switchable so either half can be turned off if it proves unhelpful.
quality:
  n_drafts: 3
  judge: true
  revise: true
  hard_reject: [structure, machine_phrases, legal_register, dash_residue, us_spelling]
  weights:
    major: 0.25
    minor: 0.08
  headline_max_words: 7
  rhythm:
    mean_min: 11
    mean_max: 20
    mean_hard_min: 9
    mean_hard_max: 24
    longest_max: 35
    min_short: 2
  length:
    min: 200
    max: 280
    hard_min: 160
    hard_max: 340
  # Percentage of body words that are NOT in config/common_words.txt - the words
  # a reader has to stop and decode. Derived from the archive on 17/08/2026, not
  # from taste: the nineteen dispatches to that date ran a median 4.2% and a
  # worst case of 7.5%, and the worst cases are exactly the ones Charlie called
  # archaic (apothecary, cobblestone, lard, chrism, vespers, hermitage). So the
  # minor threshold sits just above the median and the major one at the top of
  # the observed range. Deliberately NOT in hard_reject: sometimes the
  # unfamiliar word is the right word.
  plainness:
    rate_max: 5.0
    rate_major: 7.0
  # How far a revision may measure WORSE and still be put to the judge. The
  # deterministic score cannot see comedy, and on 22/08/2026 it threw away a
  # rewrite that fixed the exact fault its own critique had named, because the
  # draft was already a perfect 1.0 and the rewrite carried one minor violation.
  # 0.09 is one minor violation (weight 0.08) plus rounding: enough to buy a
  # better joke, not enough to smuggle a major fault past. A bigger drop is still
  # rejected outright, as are structural faults and new hard rejects.
  revise_judge_tolerance: 0.09
  # Minor faults the judge may NOT excuse, however much funnier the rewrite is.
  # Everything else inside the tolerance is taste; these are house rules with
  # stated reasons and worked examples behind them, and a joke does not buy them.
  # Added when the first re-edit dry run offered "Tycho Mayor Dies At 84, Exposed
  # As Secretly Capable" - nine words against a seven-word cap.
  revise_judge_never: [headline_length]
  # Hard-reject rules a draft can be RESCUED from when fewer than two drafts
  # survive, so the judge always has a real choice instead of an election with
  # one candidate. Only register taste belongs here - the judge is exactly the
  # right authority on whether a piece leans on the legal register, and exactly
  # the wrong one on whether it has a headline. 25/08/2026: two of three drafts
  # were eliminated on legal_register, the day was decided by elimination, and
  # Charlie said the article was not funny.
  judge_can_rescue: [legal_register]

# Daily self-improvement. Only REPETITION is automated: it is measurable, whereas
# "funny" is not, and a loop optimising only what it can measure drifts toward
# bland-but-compliant prose. Charlie's verdicts supply the quality signal, and the
# hand-written prompts are never machine-edited - see proposals.py.
learning:
  enabled: true           # kill switch: false restores the fixed prompts exactly
  window: 30              # dispatches considered when judging staleness
  min_count: 3            # occurrences before something counts as over-used
  avoid_char_cap: 1200    # hard cap on the injected block, guards prompt bloat
  exemplar_cap: 24        # maximum Charlie-endorsed premises in the few-shot pool
  proposals_weekday: 0    # Monday
