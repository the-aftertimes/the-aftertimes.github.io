exemplars:
- Bored sentries at a live missile silo convert the launch bay into a pickleball court and
  keep playing around the warhead
- A moon is promoted to middle management after outperforming the planet it orbits.
- Earth's last public beach has brought in an online booking system to manage demand, and the next weekday
