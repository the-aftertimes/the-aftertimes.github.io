- Teenagers raised on Mars refuse to visit Earth, calling its gravity 'a lot' and its oceans 'try-hard'.
- The Sun has set an out-of-office reply until March, and asked that urgent enquiries go to the Moon.
- Gravity fell two per cent in the September quarter, its weakest result since records began, and analysts
  expect a recovery once the Moon reports.
- Mercury has been let go after missing its orbit target for a third year.
