# Rotating style/format modes; one is chosen per day (with light anti-repeat).
# House voice for all: intelligent, dry, deadpan; the comedy comes from one absurd
# idea followed to its logical conclusions, never crude or broad.
#
# IMPORTANT: only "court" and "notice" are shaped as an authority handing down a
# ruling or bulletin. Every OTHER style must take a genuinely different narrative
# SHAPE - do not default to "[official body] rules X, and a spokesperson explains".
#
# EVERY style must still read as JOURNALISM - something a newspaper would print,
# written by a correspondent about events involving OTHER people. The reader is
# an outsider being told the news, never the recipient of someone's complaint.
# ("letter" and "advice" styles were removed 31/07/2026 for exactly this reason:
# a first-person council complaint is not a news dispatch.)
styles:
  - key: wire
    guidance: "A straight breaking-news wire report of an EVENT as it unfolds - who, what, where, and eyewitnesses. Not a ruling or a verdict."
  - key: feature
    guidance: "A human-centred feature that follows one named person or place through the story - scene-setting, their own words, the texture of their day. Not an announcement."
  - key: obituary
    guidance: "An obituary for a person, institution, technology or idea that has died - told as a life story in roughly chronological order, dignified and dryly fond."
  - key: review
    guidance: "A first-hand review of a product, place or experience from this future, in the reviewer's voice - evaluative, specific, ending on a verdict or a star rating."
  - key: sport
    guidance: "A match or contest report - the build-up, key moments as they happened, the final result, and a competitor's quote from the mixed zone. Play-by-play, not policy."
  - key: interview
    guidance: "A profile built around a single interview - mostly one character's voice answering questions, revealing the absurd world through how utterly normal they find it."
  - key: firstperson
    guidance: "A correspondent's first-person, present-tense eyewitness dispatch - 'I' am there, describing what I see and the people I meet, wry and observational."
  - key: court
    guidance: "A court or legal report: a ruling or case, with judicial language and a quoted opinion from the bench. (This one IS a ruling shape.)"
  - key: notice
    guidance: "An official notice or regulatory bulletin: bureaucratic and procedural, citing directives and deadlines. (This one IS a bulletin shape.)"
