styles:
- key: wire
  guidance: A straight breaking-news wire report of an EVENT as it unfolds - who, what, where, and eyewitnesses.
    Not a ruling or a verdict.
- key: feature
  guidance: >-
    A human-centred feature that follows one named person or place through the story - their own words,
    the texture of their day, the detail a wire report would skip. Not an announcement. It still OPENS on
    what happened, never on a scene. On 17/08/2026 this style produced "At dawn, eleven air-dock workers
    knelt on the cold basalt floor of Lock Four", which tells a reader nothing about the news.
- key: obituary
  guidance: An obituary for a person, institution, technology or idea that has died - told as a life story
    in roughly chronological order, dignified and dryly fond.
- key: sport
  guidance: A match or contest report - the build-up, key moments as they happened, the final result,
    and a competitor's quote from the mixed zone. Play-by-play, not policy.
- key: interview
  guidance: A profile built around a single interview - mostly one character's voice answering questions,
    revealing the absurd world through how utterly normal they find it.
# firstperson REMOVED 18/08/2026. Charlie: "shouldn't be first person (e.g. i am)".
# It is the fourth style cut for the same reason - letter, advice and review all
# went earlier because they "didn't feel like a news story". A reporter who says
# "I" is writing a column, and a column cannot report an absurd event straight.
# Earlier the same day I had tried to SAVE this style by telling it to state the
# news in the first sentence and witness it second; that was the wrong repair.
# The problem was never the lede, it was the narrator. Do not reintroduce it, and
# treat any new format that puts the correspondent in the frame the same way.
- key: investigation
  guidance: An investigative expose - the correspondent has found something being quietly concealed or
    ignored, laid out as evidence with a reluctant source and a denial.
- key: trend
  guidance: A social-trend piece on something ordinary people have started doing - what it is, who is
    doing it, what the disapproving older generation says about it.
- key: discovery
  guidance: A science or research report on a finding, with a researcher explaining it plainly and an
    unsettling implication nobody wants to dwell on.
