# The names a dispatch's people are given. cast.py draws from these.
#
# Why the run hands the writer its names instead of asking for "fresh, varied"
# ones (07/10/2026): the write prompt had asked for that since August, with a
# ban list of the names it kept reaching for (Vance, Elena, Rostova, Marcus,
# Kovac). The model obeyed the list and moved on to the next favourites: across
# 72 editions Chen appeared in 10, Tariq and Patel in 7 each, Kenji, Sunita and
# Al-Jamil in 4, and Kenji Al-Jamil was the same man on 01/10 and 05/10. A ban
# list only moves the default; supplying the names removes it.
#
# Spread across many languages on purpose, and deliberately NOT the most common
# names in any of them, which are the ones a model already defaults to. Do not
# add a name that also appears in the ban list in write.py.
