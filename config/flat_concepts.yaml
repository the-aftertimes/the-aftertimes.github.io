# Ideas Charlie found not funny. Ideate sees three a day as an avoid list
# (run.flat_concepts_block). One example per losing territory from the Eye Test,
# 06/11/2026, each lost on every pair it appeared in (51 readings).
concepts:
- A television network apologises for a news bulletin that ran so long it was still on when the viewers got home.
- Oxygen on the orbital station now comes with a loyalty card.
- A national bakery chain announces that its loaves will now be sliced so thin that customers must buy a full week of bread to make one sandwich.
- The Council of Eleven Suns has fined the planet Orlo for storing too much of its daylight.
- A form requesting fewer forms is approved, subject to four further forms.
- A newspaper replaces its horoscope with a calendar, saying the stars were never the ones making the decisions.
