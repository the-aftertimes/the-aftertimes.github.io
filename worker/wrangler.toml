# Deploy: cd worker && npx wrangler deploy
# Stores Charlie's one-tap verdicts on each edition. See src/index.js.
name = "aftertimes-verdict"
main = "src/index.js"
compatibility_date = "2026-10-01"
# Not workers.dev: that hostname carries the Cloudflare account's subdomain,
# and the page calls this from public source.
workers_dev = false
routes = [
  { pattern = "verdict.charlietrenorden.com", custom_domain = true }
]

[[kv_namespaces]]
binding = "VERDICTS"
id = "06e52b3cb266447e8ce2ff95eb9f08ae"
