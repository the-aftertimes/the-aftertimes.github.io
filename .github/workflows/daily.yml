name: daily-dispatch
on:
  schedule:
    # GitHub schedules are BEST-EFFORT and the top of the hour is the most
    # congested slot on the platform - this cron was "0 20" and ran 40-64 min
    # late every day, then was dropped outright on 06/08/2026. So: an odd minute
    # off the hour, plus a backup 2h later that publishes only if the primary
    # never landed (run.py refuses to refile a date; see run.already_filed).
    # Both crons sit in the SAME UTC day, which is what makes that guard work.
    #
    # THE BACKUP MUST LAND BEFORE CHARLIE LOOKS, which is 07:55 AEST / 21:55 UTC.
    # On 26/08/2026 GitHub dropped the 20:13 primary here, Photocopy's 20:40 and the
    # hub's 21:05 thumbnail job - all three in the same band. All three had a backup
    # and every one was scheduled after 07:55, so he opened the paper to a stale card
    # and the estate healed quietly once he had gone. A backup that runs after the
    # reader has left is not a backup.
    - cron: "13 19 * * *"   # 19:13 UTC / 05:13 AEST - primary. An hour earlier than
                            # the old 20:13: One Story sits at 18:00/19:00 and was the
                            # only daily job GitHub did NOT drop on 26/08.
    - cron: "13 21 * * *"   # 21:13 UTC / 07:13 AEST - backup, lands 07:29-07:35 with
                            # the 16-22 min of scheduler lateness this estate sees, so
                            # a dropped primary is fixed before he opens the page.
    - cron: "13 22 * * *"   # 22:13 UTC / 08:13 AEST - third line. Too late to save the
                            # morning; kept because a dispatch is better late than
                            # missing. All four sit in the SAME UTC day, which is what
                            # makes the already_filed guard work.
  workflow_dispatch:

# The newsletter was RETIRED on 13/08/2026 - this site is web-only now. See
# docs/TODO.md for why. The sending code (send_email.py, email_render.py,
# brevo_sender.py) is left in the repo but is no longer wired to anything.
permissions:
  contents: write

concurrency:
  group: daily-dispatch
  cancel-in-progress: false

jobs:
  file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install deps
        run: pip install -r requirements.txt

      # Before the model is called and before anything is written. requirements.txt
      # has installed pytest since the repo was built and nothing ever ran it, so
      # 259 tests guarding the ledger, the archive, the date handling and the
      # prompt-injection filters sat there while the pipeline published daily.
      # A red gate costs a day's dispatch and shows as a failed run; a bad
      # dispatch is permanent and shows as nothing at all.
      - name: Tests must pass before anything is generated
        run: python -m pytest tests -q

      - name: Generate today's dispatch
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python run.py

      - name: Commit and push
        run: |
          git config user.name "aftertimes-bot"
          git config user.email "bot@the-aftertimes.github.io"
          # docs/proposals.md is written on the configured weekday only.
          # Without it here the weekly document would be generated and never
          # committed, which is the same written-but-unwired failure that
          # left proposals.py uncalled for a month in the first place.
          git add index.html archive.html d/ data/ assets/img/ docs/proposals.md
          git commit -m "dispatch: $(date -u +%Y-%m-%d)" || echo "no changes"
          git push
