name: daily-dispatch
on:
  schedule:
    # GitHub schedules are BEST-EFFORT and the top of the hour is the most
    # congested slot on the platform - this cron was "0 20" and ran 40-64 min
    # late every day, then was dropped outright on 06/08/2026. So: an odd minute
    # off the hour, plus a backup 2h later that publishes only if the primary
    # never landed (run.py refuses to refile a date; see run.already_filed).
    # Both crons sit in the SAME UTC day, which is what makes that guard work.
    #
    # THE BACKUP MUST LAND BEFORE CHARLIE LOOKS, which is 07:55 AEST / 21:55 UTC.
    # On 26/08/2026 GitHub dropped the 20:13 primary here, Photocopy's 20:40 and the
    # hub's 21:05 thumbnail job - all three in the same band. All three had a backup
    # and every one was scheduled after 07:55, so he opened the paper to a stale card
    # and the estate healed quietly once he had gone. A backup that runs after the
    # reader has left is not a backup.
    #
    # WHY 19:13 AND NOT THE OLD 20:13 - corrected 28/08/2026. Moved on 27/08 on
    # the theory that the 20:00-21:00 UTC band is congested, inferred from One
    # Story surviving 26/08 at 18:00/19:00. That inference was WRONG: GitHub's
    # status history records four Actions incidents on 26/08 (15:09, 15:11,
    # 22:56, plus a billing disruption at 23:37), this workflow had run twice a
    # day at ~20:35 and ~22:40 for the six days before it without missing once,
    # and One Story failed on 27/08 too. The platform was broken; the slot was
    # fine. The earlier time is kept only as free margin.
    #
    # MOVED EARLIER 31/08/2026, and the "16-22 min of lateness" above is stale.
    # Measured over the eight days to 26/08 the two crons landed 22-31 min late.
    # Over the four days since they have landed 2h02-2h41 late, every single
    # time. At that slippage the last rung of the old 19/21/22 ladder crossed
    # midnight UTC, filed the NEXT day's date, and silenced that day's entire
    # ladder - so the only run doing any work was the last one, at 10:35 AEST.
    # run.publication_date() now keys the guard on the Sydney date, which has no
    # boundary inside the ladder; this move is the second half, buying enough
    # margin that the FIRST rung lands before he looks rather than the last.
    - cron: "13 15 * * *"   # 15:13 UTC / 01:13 AEST - primary. Lands 15:35-17:55.
    - cron: "13 17 * * *"   # 17:13 UTC / 03:13 AEST - backup.
    - cron: "13 19 * * *"   # 19:13 UTC / 05:13 AEST - third line. Even at the 2h41
                            # worst observed this lands 21:54 UTC / 07:54 AEST, ahead
                            # of the 07:55 read. All three share a Sydney date.
  workflow_dispatch:
  # Fired by the heartbeat Worker (site-stats/heartbeat) at 20:30 UTC, from
  # OUTSIDE GitHub Actions. On 26/08/2026 GitHub's scheduler went down and took
  # every cron on the estate with it, catch-ups included; a backup that shares a
  # failure domain with the thing it backs up is not a backup. Safe to fire
  # redundantly - the already-filed guard makes a second run of the day a no-op.
  repository_dispatch:
    types: [heartbeat]

# The newsletter was RETIRED on 13/08/2026 - this site is web-only now. See
# docs/TODO.md for why. The sending code (send_email.py, email_render.py,
# brevo_sender.py) is left in the repo but is no longer wired to anything.
permissions:
  contents: write

concurrency:
  group: daily-dispatch
  cancel-in-progress: false

jobs:
  file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install deps
        run: pip install -r requirements.txt

      # Before the model is called and before anything is written. requirements.txt
      # has installed pytest since the repo was built and nothing ever ran it, so
      # 259 tests guarding the ledger, the archive, the date handling and the
      # prompt-injection filters sat there while the pipeline published daily.
      # A red gate costs a day's dispatch and shows as a failed run; a bad
      # dispatch is permanent and shows as nothing at all.
      - name: Tests must pass before anything is generated
        run: python -m pytest tests -q

      - name: Generate today's dispatch
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python run.py

      - name: Commit and push
        run: |
          git config user.name "aftertimes-bot"
          git config user.email "bot@the-aftertimes.github.io"
          # docs/proposals.md is written on the configured weekday only.
          # Without it here the weekly document would be generated and never
          # committed, which is the same written-but-unwired failure that
          # left proposals.py uncalled for a month in the first place.
          git add index.html archive.html d/ data/ assets/img/ docs/proposals.md
          git commit -m "dispatch: $(date -u +%Y-%m-%d)" || echo "no changes"
          git push
