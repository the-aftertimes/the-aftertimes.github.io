name: daily-dispatch
on:
  schedule:
    - cron: "0 20 * * *"   # 20:00 UTC daily (matches One Story)
  workflow_dispatch:
    inputs:
      test_send:
        description: "Send a one-off test email now (does not affect the daily send)"
        type: boolean
        default: false
      test_email:
        description: "Override the test recipient (defaults to the BREVO_TEST_EMAIL secret)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-dispatch
  cancel-in-progress: false

jobs:
  file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install deps
        run: pip install -r requirements.txt
      # A test send re-emails the LAST COMMITTED dispatch, so it deliberately does
      # NOT regenerate: doing so would burn a day's model quota and republish over
      # the live page (desyncing it from the edition subscribers already received).
      - name: Generate today's dispatch
        if: ${{ !inputs.test_send }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python run.py
      # Emails the list if the newsletter is enabled AND BREVO_API_KEY is set;
      # otherwise it dry-runs. A per-day guard prevents a double-send on re-runs.
      - name: Send newsletter (if configured)
        continue-on-error: true   # an email hiccup must never block publishing
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          # only used by --test; the workflow input overrides the secret so a test
          # can be aimed at an arbitrary address without editing secrets
          BREVO_TEST_EMAIL: ${{ inputs.test_email || secrets.BREVO_TEST_EMAIL }}
        run: python send_email.py ${{ github.event.inputs.test_send == 'true' && '--test' || '' }}
      - name: Commit and push
        if: ${{ !inputs.test_send }}
        run: |
          git config user.name "aftertimes-bot"
          git config user.email "bot@the-aftertimes.github.io"
          git add index.html archive.html d/ data/ assets/img/
          git commit -m "dispatch: $(date -u +%Y-%m-%d)" || echo "no changes"
          git push
