name: daily-dispatch
on:
  schedule:
    # GitHub schedules are BEST-EFFORT and the top of the hour is the most
    # congested slot on the platform - this cron was "0 20" and ran 40-64 min
    # late every day, then was dropped outright on 06/08/2026. So: an odd minute
    # off the hour, plus a backup 2h later that publishes only if the primary
    # never landed (run.py refuses to refile a date; see run.already_filed).
    # Both crons sit in the SAME UTC day, which is what makes that guard work.
    - cron: "13 20 * * *"   # 20:13 UTC / 06:13 AEST - primary
    - cron: "13 22 * * *"   # 22:13 UTC / 08:13 AEST - backup if the primary was dropped
  workflow_dispatch:
    inputs:
      test_send:
        description: "Send a one-off test email now (does not affect the daily send)"
        type: boolean
        default: false
      test_email:
        description: "Override the test recipient (defaults to the BREVO_TEST_EMAIL secret)"
        type: string
        default: ""

permissions:
  contents: write
  issues: write   # the send-failure alarm files/updates an issue

concurrency:
  group: daily-dispatch
  cancel-in-progress: false

jobs:
  file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install deps
        run: pip install -r requirements.txt
      # A test send re-emails the LAST COMMITTED dispatch, so it deliberately does
      # NOT regenerate: doing so would burn a day's model quota and republish over
      # the live page (desyncing it from the edition subscribers already received).
      - name: Generate today's dispatch
        if: ${{ !inputs.test_send }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python run.py
      # Emails the list if the newsletter is enabled AND BREVO_API_KEY is set;
      # otherwise it dry-runs. A per-day guard prevents a double-send on re-runs.
      - name: Send newsletter (if configured)
        id: send
        continue-on-error: true   # an email hiccup must never block publishing
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          # only used by --test; the workflow input overrides the secret so a test
          # can be aimed at an arbitrary address without editing secrets
          BREVO_TEST_EMAIL: ${{ inputs.test_email || secrets.BREVO_TEST_EMAIL }}
        run: python send_email.py ${{ github.event.inputs.test_send == 'true' && '--test' || '' }}
      # The newsletter died on 10/08/2026 and nobody noticed for three days,
      # because continue-on-error (correctly) keeps publishing alive and so the
      # run still reports "success" - a dead newsletter looked exactly like a
      # healthy one. Email cannot be the alarm here, since email is the thing
      # that breaks, so raise a GitHub issue instead. Reuses one open issue so a
      # long outage does not file a new one every day.
      - name: Flag a failed send
        if: ${{ !inputs.test_send && steps.send.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Newsletter send is failing"
          existing=$(gh issue list --state open --search "$title in:title" \
            --json number --jq '.[0].number // empty')
          body="The daily send failed on $(date -u +%Y-%m-%d). Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          If this is a Brevo hold (HTTP 402 account_under_validation) the send is now latched off - see data/send_hold.json. Clear it with \`python send_email.py --clear-hold\` once the account is resolved."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Commit and push
        if: ${{ !inputs.test_send }}
        run: |
          git config user.name "aftertimes-bot"
          git config user.email "bot@the-aftertimes.github.io"
          git add index.html archive.html d/ data/ assets/img/
          git commit -m "dispatch: $(date -u +%Y-%m-%d)" || echo "no changes"
          git push
