name: brevo-admin

# Manual only. Exists so sender/domain admin can run where BREVO_API_KEY already
# lives, instead of the key being copied onto a laptop. Never runs on a schedule.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "list / campaign (read-only) or create (adds the sender from settings.yaml)"
        type: choice
        options: [list, campaign, create]
        default: list

jobs:
  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: python brevo_sender.py ${{ inputs.action }}
