# Concepts written 06/11/2026 for Charlie's first concepts round, to test
# territories the ideate prompt never reaches. Deliberately short, and
# deliberately free of the archive's crutch device (an ancient rule, record or
# mistranslation causing the absurdity). `angle` is recorded so his marks can be
# read by territory, not only one by one.
concepts:
  - angle: work
    text: A mining crew meets in person for the first time in three hundred years and immediately schedules a follow-up call.
  - angle: work
    text: A habitat's air recycler is named employee of the decade and declines to attend its own presentation.
  - angle: work
    text: A generation ship's middle managers vote to delay arrival by forty years because the new planet has no reporting lines.
  - angle: work
    text: After productivity rises every year since the three-day week, a colony moves to a one-meeting-a-month week, and output doubles again.
  - angle: tech
    text: The city's AI mayor resigns citing burnout and endorses its own previous version.
  - angle: tech
    text: A colony's terms and conditions, unread for four hundred years, are read aloud at a funeral and turn out to include the funeral.
  - angle: property
    text: Asteroid property prices fall forty per cent after buyers learn the asteroid is moving.
  - angle: property
    text: An orbital one-bedroom is advertised as cosy, light-filled and close to the sun. It is falling into the sun.
  - angle: dating
    text: A dating service for clones reports record matches; every couple has since split, citing irreconcilable similarities.
  - angle: dating
    text: A man spends eleven years composing the perfect reply to a message, during which the sender has been frozen and thawed twice.
  - angle: tourism
    text: Earth reopens to tourists, who rate it overcrowded, overrated and smaller than in the photos.
  - angle: tourism
    text: The last beach on Earth introduces a booking system. The next available slot is in 2900.
  - angle: generational
    text: Teenagers on Titan adopt standing up straight as an ironic aesthetic, purely to annoy parents raised in low gravity.
  - angle: generational
    text: A grandmother born in zero gravity is told by her grandson she has no idea how hard it was walking uphill.
  - angle: food
    text: Lab-grown steak is withdrawn after the original cow objects to being impersonated.
  - angle: food
    text: A tasting menu of nine courses of deconstructed air wins three stars; diners leave hungry and deeply moved.
  - angle: science
    text: Scientists announce they are ninety-five per cent certain about something and decline to say what.
  - angle: science
    text: Teleportation is ready for human trials, but nobody will go first, and whoever goes second keeps arriving before them.
  - angle: sport
    text: The zero-gravity hundred metres is won by whoever started first, because nobody has ever been able to stop.
  - angle: sport
    text: A colony chess final enters its ninth generation; the current players are grandchildren of the people who made the first move.
  - angle: bureaucracy
    text: A form requesting fewer forms is approved, subject to four further forms.
  - angle: bureaucracy
    text: The Ministry of Time adds a twenty-fifth hour to the day and fills it immediately with a meeting about the twenty-fifth hour.
  - angle: money
    text: A savings account opened in 2026 finally matures; the interest is enough to buy the bank, which declines to be bought.
  - angle: money
    text: Inflation on Mars falls to zero after the last item for sale is sold.
  - angle: school
    text: A school replaces exams with vibes. The vibes are now externally moderated.
  - angle: school
    text: Children on a generation ship are told the destination is just around the corner for the hundred and fortieth consecutive year.
  - angle: media
    text: The colony paper reports no news for a third straight year and is shortlisted for accuracy.
  - angle: media
    text: An influencer with a hundred billion followers asks them to stop following her, and gains four billion.
  - angle: nature
    text: Pigeons reintroduced to a space station form a union within a week.
  - angle: nature
    text: The last mosquito in the galaxy is given a protected reserve, which no one has ever visited.
